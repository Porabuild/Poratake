<!doctype html><meta charset="utf-8" />
<pre id="result">pending</pre>
<script>
  (async () => {
    const results = [];
    for (const scale of [1, 1.25, 2]) {
      for (const offset of [0, 0.25, 0.5]) {
        const width = Math.round(40 * scale),
          height = Math.round(40 * scale);
        const x = (8 + offset) * scale,
          y = (8 + offset) * scale;
        const right = x + 20 * scale,
          bottom = y + 20 * scale,
          radius = 2;
        const k = 0.5522847498307936 * radius;
        const path = `M ${x + radius} ${y} L ${right - radius} ${y} C ${right - radius + k} ${y} ${right} ${y + radius - k} ${right} ${y + radius} L ${right} ${bottom - radius} C ${right} ${bottom - radius + k} ${right - radius + k} ${bottom} ${right - radius} ${bottom} L ${x + radius} ${bottom} C ${x + radius - k} ${bottom} ${x} ${bottom - radius + k} ${x} ${bottom - radius} L ${x} ${y + radius} C ${x} ${y + radius - k} ${x + radius - k} ${y} ${x + radius} ${y} Z`;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><rect width="${width}" height="${height}" fill="#f0f"/><rect x="${x}" y="${y}" width="${20 * scale}" height="${20 * scale}" rx="2" fill="#000"/></svg>`;
        const svgPath = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><rect width="${width}" height="${height}" fill="#f0f"/><path d="${path}" fill="#000"/></svg>`;
        const image = new Image(),
          pathImage = new Image();
        const url = URL.createObjectURL(
          new Blob([svg], { type: 'image/svg+xml' })
        );
        const pathUrl = URL.createObjectURL(
          new Blob([svgPath], { type: 'image/svg+xml' })
        );
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });
        await new Promise((resolve, reject) => {
          pathImage.onload = resolve;
          pathImage.onerror = reject;
          pathImage.src = pathUrl;
        });
        for (const mode of [
          'svg-image',
          'svg-nearest',
          'svg-path',
          'canvas-path',
          'canvas-bezier',
        ]) {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext('2d');
          if (mode.startsWith('svg-')) {
            context.imageSmoothingEnabled = mode !== 'svg-nearest';
            context.drawImage(mode === 'svg-path' ? pathImage : image, 0, 0);
          } else {
            context.fillStyle = '#f0f';
            context.fillRect(0, 0, width, height);
            context.fillStyle = '#000';
            context.beginPath();
            if (mode === 'canvas-path') {
              context.roundRect(x, y, 20 * scale, 20 * scale, radius);
            } else {
              context.fill(new Path2D(path));
            }
            if (mode === 'canvas-path') context.fill();
          }
          const data = context.getImageData(
            Math.floor(x),
            Math.floor(y),
            4,
            4
          ).data;
          results.push({
            scale,
            offset,
            mode,
            dpr: devicePixelRatio,
            red: Array.from({ length: 4 }, (_, row) =>
              Array.from(
                { length: 4 },
                (_, column) => data[(row * 4 + column) * 4]
              )
            ),
          });
        }
        URL.revokeObjectURL(url);
        URL.revokeObjectURL(pathUrl);
      }
    }
    document.querySelector('#result').textContent = JSON.stringify(results);
  })().catch(error => {
    document.querySelector('#result').textContent = String(error);
  });
</script>
