<!doctype html>
<pre id="result"></pre>
<script>
  const out = {};
  for (const scale of [1, 1.25, 1.3333333, 2])
    for (const offset of [0, 0.5])
      for (const mode of ['stroke', 'fill', 'circle']) {
        const c = document.createElement('canvas');
        c.width = 240;
        c.height = 240;
        const t = c.getContext('2d');
        t.fillStyle = '#e8e8e8';
        t.fillRect(0, 0, c.width, c.height);
        const x = 20 + offset,
          y = 20 + offset,
          r = 10 * scale,
          w = 140,
          h = 148;
        t.beginPath();
        if (mode === 'circle') {
          t.arc(x + 13 * scale, y + 14 * scale, 6 * scale, 0, Math.PI * 2);
          t.fillStyle = '#ff5f57';
          t.fill();
        } else {
          t.roundRect(x, y, w, h, r);
          if (mode === 'stroke') {
            t.strokeStyle = '#a8a8a8';
            t.lineWidth = scale;
            t.stroke();
          } else {
            t.fillStyle = '#2468ac';
            t.fill();
          }
        }
        out[`${scale}-${offset}-${mode}`] = c
          .toDataURL('image/png')
          .split(',')[1];
      }
  document.querySelector('#result').textContent = JSON.stringify(out);
</script>
