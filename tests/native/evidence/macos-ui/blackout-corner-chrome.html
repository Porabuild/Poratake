<!doctype html><meta charset="utf-8" />
<pre id="result">pending</pre>
<script>
  (async () => {
    const results = [];
    for (const scale of [1, 1.25, 2])
      for (const offset of [0, 0.25, 0.5]) {
        const w = Math.round(40 * scale),
          h = Math.round(40 * scale);
        const x = (8 + offset) * scale,
          y = (8 + offset) * scale;
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="' +
          w +
          '" height="' +
          h +
          '"><rect x="0" y="0" width="' +
          w +
          '" height="' +
          h +
          '" fill="#ff00ff"/><rect x="' +
          x +
          '" y="' +
          y +
          '" width="' +
          20 * scale +
          '" height="' +
          20 * scale +
          '" fill="#000" rx="2"/></svg>';
        const img = new Image();
        const url = URL.createObjectURL(
          new Blob([svg], { type: 'image/svg+xml' })
        );
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = url;
        });
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const sx = Math.floor(x),
          sy = Math.floor(y);
        const pixels = ctx.getImageData(sx, sy, 4, 4).data;
        results.push({
          scale,
          offset,
          x,
          y,
          red: Array.from({ length: 4 }, (_, row) =>
            Array.from({ length: 4 }, (_, col) => pixels[(row * 4 + col) * 4])
          ),
        });
      }
    document.querySelector('#result').textContent = JSON.stringify(results);
  })().catch(error => {
    document.querySelector('#result').textContent = String(error);
  });
</script>
