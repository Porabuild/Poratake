name: Linux capture dependencies
description: Install the GTK, PipeWire, X11, Wayland, and audio headers used by the GPUI shell and Linux daemon.

runs:
  using: composite
  steps:
    - name: Install native packages
      shell: bash
      run: |
        sudo apt-get update --error-on=any
        sudo apt-get install -y --no-install-recommends libclang-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libpipewire-0.3-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev libasound2-dev xauth xvfb
