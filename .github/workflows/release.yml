name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.1.0)'
        required: true
        type: string
permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.1.0)"
            exit 1
          fi
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag v$VERSION already exists"
            exit 1
          fi
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install macOS native build tools
        run: |
          # Runner images preinstall aws/tap, which trips Homebrew's tap-trust
          # check and prints a notice on every invocation. We don't use it.
          brew untap aws/tap || true
          brew install nasm pkg-config cmake

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Update package.json version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Cache native binaries
        uses: actions/cache@v5
        with:
          path: |
            src/main/binaries/ffmpeg
            src/main/binaries/whisper
            src/main/daemon/poratake-daemon
          key: macos-native-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-whisper.sh', 'scripts/build-daemon.sh', 'src/main/daemon/**/*.swift') }}

      - name: Setup macOS certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      - name: Build native macOS binaries
        run: bun run build-native-mac

      - name: Package and notarize macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -o pipefail
          BUILD_LOG=$(mktemp)
          bun run package-mac 2>&1 | tee "$BUILD_LOG"
          if grep -qiE "notarize skipped|skipped macOS notarization|notarize.*options were unable to be generated" "$BUILD_LOG"; then
            rm -f "$BUILD_LOG"
            exit 1
          fi
          APP_PATH=$(find "release/${{ inputs.version }}" -type d -path "*/Poratake.app" -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$BUILD_LOG"

      - name: Validate release assets
        run: |
          VERSION="${{ inputs.version }}"
          RELEASE_DIR="release/$VERSION"
          DMG="$RELEASE_DIR/Poratake-$VERSION-universal.dmg"
          ZIP="$RELEASE_DIR/Poratake-$VERSION-universal-mac.zip"
          METADATA="$RELEASE_DIR/latest-mac.yml"
          BLOCKMAP="$ZIP.blockmap"
          APP_RESOURCES=$(find "$RELEASE_DIR" -type d -path "*/Poratake.app/Contents/Resources" -print -quit)
          test -n "$APP_RESOURCES"
          node scripts/validate-release-assets.mjs "$VERSION" "$DMG" "$ZIP" "$METADATA" "$BLOCKMAP" "$APP_RESOURCES"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-universal.dmg
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-universal-mac.zip
            release/${{ inputs.version }}/latest-mac.yml
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-universal-mac.zip.blockmap
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-gcc make nasm pkgconf curl tar
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang make nasm pkgconf curl tar
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Update package.json version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/daemon-win/target
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ hashFiles('src/main/daemon-win/Cargo.lock') }}

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.packages }}

      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            src/main/binaries/ffmpeg
            src/main/binaries/whisper
            src/main/daemon/poratake-daemon.exe
          key: ${{ runner.os }}-${{ matrix.arch }}-native-${{ hashFiles('scripts/build-ffmpeg-win.sh', 'scripts/build-whisper-win.ps1', 'src/main/daemon-win/Cargo.toml', 'src/main/daemon-win/Cargo.lock', 'src/main/daemon-win/src/**.rs') }}

      - name: Build Windows package
        run: bun run build-win
        env:
          PORATAKE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          PORATAKE_WIN_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate Windows release assets
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch }}"
          RELEASE_DIR="release/$VERSION"
          NSIS="$RELEASE_DIR/Poratake-$VERSION-win-$ARCH.exe"
          METADATA="$RELEASE_DIR/latest.yml"
          BLOCKMAP="$NSIS.blockmap"
          node scripts/validate-release-assets-win.mjs "$VERSION" "$NSIS" "$METADATA" "$BLOCKMAP"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-win-${{ matrix.arch }}.exe
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-win-${{ matrix.arch }}.exe.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          pattern: release-*
          merge-multiple: true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Update package.json version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Generate release notes from commits
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          FEATURES=""
          FIXES=""

          while IFS= read -r commit; do
            if [ -z "$commit" ]; then
              continue
            fi

            if echo "$commit" | grep -qiE "^feat(\(.*\))?:"; then
              MSG=$(echo "$commit" | sed -E 's/^feat(\([^)]*\))?:[[:space:]]*//')
              MSG="$(echo "${MSG:0:1}" | tr '[:lower:]' '[:upper:]')${MSG:1}"
              FEATURES="${FEATURES}- ${MSG}\n"
            elif echo "$commit" | grep -qiE "^fix(\(.*\))?:"; then
              MSG=$(echo "$commit" | sed -E 's/^fix(\([^)]*\))?:[[:space:]]*//')
              MSG="$(echo "${MSG:0:1}" | tr '[:lower:]' '[:upper:]')${MSG:1}"
              FIXES="${FIXES}- ${MSG}\n"
            fi
          done <<< "$COMMITS"

          RELEASE_NOTES=""

          if [ -n "$FEATURES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}## Features\n${FEATURES}"
          fi

          if [ -n "$FIXES" ]; then
            if [ -n "$RELEASE_NOTES" ]; then
              RELEASE_NOTES="${RELEASE_NOTES}\n"
            fi
            RELEASE_NOTES="${RELEASE_NOTES}## Bug Fixes\n${FIXES}"
          fi

          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="No changelog provided"
          fi

          RELEASE_NOTES=$(echo -e "$RELEASE_NOTES" | sed 's/\\n$//')
          echo -e "$RELEASE_NOTES" > release_notes.txt
          cat release_notes.txt

      - name: Merge Windows updater metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ASSET_DIR="${{ runner.temp }}/release-assets"
          node scripts/merge-windows-latest-yml.mjs \
            "$VERSION" \
            "$ASSET_DIR/Poratake-$VERSION-win-x64.exe" \
            "$ASSET_DIR/Poratake-$VERSION-win-arm64.exe" \
            "$ASSET_DIR/latest.yml"

      - name: Validate collected release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ASSET_DIR="${{ runner.temp }}/release-assets"
          EXPECTED_ASSETS=$(node scripts/published-release-assets.mjs expected "$VERSION")
          ACTUAL_ASSETS=$(find "$ASSET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$ACTUAL_ASSETS" = "$EXPECTED_ASSETS"

      - name: Push release commit and staging tag
        env:
          DRAFT_TAG: release-draft-${{ github.run_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "Version is already set to $VERSION"
          else
            git commit -m "chore: bump version to $VERSION"
          fi
          BUILD_COMMIT=$(git rev-parse HEAD)
          echo "BUILD_COMMIT=$BUILD_COMMIT" >> "$GITHUB_ENV"
          git tag "$DRAFT_TAG"
          git push origin "HEAD:${GITHUB_REF}"
          git push origin "$DRAFT_TAG"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-draft-${{ github.run_id }}
          name: Poratake v${{ inputs.version }}
          body_path: release_notes.txt
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/release-assets/*

      - name: Verify and publish GitHub Release
        env:
          DRAFT_TAG: release-draft-${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="v$VERSION"
          ASSET_DIR="${{ runner.temp }}/release-assets"
          EXPECTED_ASSETS=$(node scripts/published-release-assets.mjs expected "$VERSION")
          ACTUAL_ASSETS=$(gh release view "$DRAFT_TAG" --json assets --jq '.assets[].name' | sort)
          test "$ACTUAL_ASSETS" = "$EXPECTED_ASSETS"
          for ASSET_PATH in "$ASSET_DIR"/*; do
            ASSET_NAME=$(basename "$ASSET_PATH")
            ASSET_SIZE=$(stat -c%s "$ASSET_PATH")
            REMOTE_SIZE=$(gh release view "$DRAFT_TAG" --json assets --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .size")
            test -n "$REMOTE_SIZE"
            test "$REMOTE_SIZE" = "$ASSET_SIZE"
          done
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$DRAFT_TAG\") | .id")
          test -n "$RELEASE_ID"
          gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -f tag_name="$TAG" \
            -f target_commitish="$BUILD_COMMIT" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true
          REMOTE_TAG_COMMIT=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [ -z "$REMOTE_TAG_COMMIT" ]; then
            REMOTE_TAG_COMMIT=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          test "$REMOTE_TAG_COMMIT" = "$BUILD_COMMIT"
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$DRAFT_TAG" ||
            echo "Published successfully but could not delete staging tag $DRAFT_TAG"

  cleanup-failed-release:
    needs: [prepare, build-macos, build-windows, publish]
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove failed release and tag
        env:
          DRAFT_TAG: release-draft-${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          gh release delete "$DRAFT_TAG" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          if gh api "repos/${{ github.repository }}/git/ref/tags/$DRAFT_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$DRAFT_TAG"
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG"
          fi
