name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.1.0)'
        required: true
        type: string
permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.1.0)"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install macOS native build tools
        run: brew install nasm pkg-config cmake

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Update package.json version
        run: |
          VERSION="${{ inputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "Version is already set to ${{ inputs.version }}"
          else
            git commit -m "chore: bump version to ${{ inputs.version }}"
          fi
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate release notes from commits
        id: release_notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag, get all commits
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            # Get commits since the previous tag
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          # Initialize arrays for features and fixes (other commits are internal)
          FEATURES=""
          FIXES=""

          # Parse commits and categorize them (only feat: and fix: are public, rest are internal)
          while IFS= read -r commit; do
            # Skip empty lines
            if [ -z "$commit" ]; then
              continue
            fi

            # Check for feature commits (feat: or feature:)
            if echo "$commit" | grep -qiE "^feat(\(.*\))?:"; then
              # Extract the message after feat: or feat(scope):
              MSG=$(echo "$commit" | sed -E 's/^feat(\([^)]*\))?:[[:space:]]*//')
              # Capitalize first letter
              MSG="$(echo "${MSG:0:1}" | tr '[:lower:]' '[:upper:]')${MSG:1}"
              FEATURES="${FEATURES}- ${MSG}\n"
            # Check for fix commits (fix:)
            elif echo "$commit" | grep -qiE "^fix(\(.*\))?:"; then
              # Extract the message after fix: or fix(scope):
              MSG=$(echo "$commit" | sed -E 's/^fix(\([^)]*\))?:[[:space:]]*//')
              # Capitalize first letter
              MSG="$(echo "${MSG:0:1}" | tr '[:lower:]' '[:upper:]')${MSG:1}"
              FIXES="${FIXES}- ${MSG}\n"
            fi
            # All other commits (chore, refactor, docs, etc.) are considered internal and hidden
          done <<< "$COMMITS"

          # Build the release notes
          RELEASE_NOTES=""

          if [ -n "$FEATURES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}## Features\n${FEATURES}"
          fi

          if [ -n "$FIXES" ]; then
            if [ -n "$RELEASE_NOTES" ]; then
              RELEASE_NOTES="${RELEASE_NOTES}\n"
            fi
            RELEASE_NOTES="${RELEASE_NOTES}## Bug Fixes\n${FIXES}"
          fi

          # If no features or fixes, provide default message
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="No changelog provided"
          fi

          # Remove trailing newlines and escape for GitHub Actions
          RELEASE_NOTES=$(echo -e "$RELEASE_NOTES" | sed 's/\\n$//')

          # Write to file for multi-line output
          echo -e "$RELEASE_NOTES" > release_notes.txt

          echo "Generated release notes:"
          cat release_notes.txt

      - name: Cache native binaries
        uses: actions/cache@v5
        with:
          path: |
            src/main/binaries/ffmpeg
            src/main/binaries/whisper
            src/main/daemon/capty-daemon
          key: macos-native-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-whisper.sh', 'scripts/build-daemon.sh', 'src/main/daemon/**/*.swift') }}

      - name: Setup macOS certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" build.keychain
          rm certificate.p12

      - name: Build native macOS binaries
        run: bun run build-native-mac

      - name: Package and notarize macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -o pipefail
          BUILD_LOG=$(mktemp)
          bun run package-mac 2>&1 | tee "$BUILD_LOG"
          if grep -qiE "notarize skipped|skipped macOS notarization|notarize.*options were unable to be generated" "$BUILD_LOG"; then
            rm -f "$BUILD_LOG"
            exit 1
          fi
          APP_PATH=$(find "release/${{ inputs.version }}" -type d -path "*/Poratake.app" -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$BUILD_LOG"

      - name: Validate release assets
        run: |
          VERSION="${{ inputs.version }}"
          RELEASE_DIR="release/$VERSION"
          DMG="$RELEASE_DIR/Poratake-$VERSION-universal.dmg"
          ZIP="$RELEASE_DIR/Poratake-$VERSION-universal-mac.zip"
          METADATA="$RELEASE_DIR/latest-mac.yml"
          BLOCKMAP="$ZIP.blockmap"
          APP_RESOURCES=$(find "$RELEASE_DIR" -type d -path "*/Poratake.app/Contents/Resources" -print -quit)
          test -n "$APP_RESOURCES"
          node scripts/validate-release-assets.mjs "$VERSION" "$DMG" "$ZIP" "$METADATA" "$BLOCKMAP" "$APP_RESOURCES"

      - name: Push release commit and tag
        run: |
          VERSION="${{ inputs.version }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$BUILD_COMMIT"
          else
            git tag "v$VERSION"
          fi
          git push origin "HEAD:${GITHUB_REF}"
          git push origin "v$VERSION"
          REMOTE_TAG_COMMIT=$(git ls-remote origin "refs/tags/v$VERSION^{}" | awk '{print $1}')
          if [ -z "$REMOTE_TAG_COMMIT" ]; then
            REMOTE_TAG_COMMIT=$(git ls-remote origin "refs/tags/v$VERSION" | awk '{print $1}')
          fi
          test "$REMOTE_TAG_COMMIT" = "$BUILD_COMMIT"

      - name: Create draft GitHub Release with macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Poratake v${{ inputs.version }}
          body_path: release_notes.txt
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-universal.dmg
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-universal-mac.zip
            release/${{ inputs.version }}/latest-mac.yml
            release/${{ inputs.version }}/Poratake-${{ inputs.version }}-universal-mac.zip.blockmap

      - name: Verify macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"
          RELEASE_DIR="release/$VERSION"
          for ASSET_PATH in \
            "$RELEASE_DIR/Poratake-$VERSION-universal.dmg" \
            "$RELEASE_DIR/Poratake-$VERSION-universal-mac.zip" \
            "$RELEASE_DIR/latest-mac.yml" \
            "$RELEASE_DIR/Poratake-$VERSION-universal-mac.zip.blockmap"; do
            ASSET_NAME=$(basename "$ASSET_PATH")
            ASSET_SIZE=$(stat -f%z "$ASSET_PATH")
            REMOTE_SIZE=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .size")
            test -n "$REMOTE_SIZE"
            test "$REMOTE_SIZE" = "$ASSET_SIZE"
          done

  build-windows:
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-gcc make nasm pkgconf curl tar
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang make nasm pkgconf curl tar
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/daemon-win/target
          key: ${{ runner.os }}-${{ matrix.arch }}-rust-${{ hashFiles('src/main/daemon-win/Cargo.lock') }}

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.packages }}

      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            src/main/binaries/ffmpeg
            src/main/binaries/whisper
            src/main/daemon/capty-daemon.exe
          key: ${{ runner.os }}-${{ matrix.arch }}-native-${{ hashFiles('scripts/build-ffmpeg-win.sh', 'scripts/build-whisper-win.ps1', 'src/main/daemon-win/Cargo.toml', 'src/main/daemon-win/Cargo.lock', 'src/main/daemon-win/src/**.rs') }}

      - name: Build Windows package
        run: bun run build-win
        env:
          PORATAKE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          PORATAKE_WIN_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate Windows release assets
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch }}"
          RELEASE_DIR="release/$VERSION"
          NSIS="$RELEASE_DIR/Poratake-$VERSION-win-$ARCH.exe"
          METADATA="$RELEASE_DIR/latest.yml"
          BLOCKMAP="$NSIS.blockmap"
          node scripts/validate-release-assets-win.mjs "$VERSION" "$NSIS" "$METADATA" "$BLOCKMAP"

      - name: Upload Windows assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="v$VERSION"
          RELEASE_DIR="release/$VERSION"
          gh release upload "$TAG" \
            "$RELEASE_DIR/Poratake-$VERSION-win-$ARCH.exe" \
            "$RELEASE_DIR/Poratake-$VERSION-win-$ARCH.exe.blockmap" \
            --clobber
          if [ "$ARCH" = "x64" ]; then
            gh release upload "$TAG" "$RELEASE_DIR/latest.yml" --clobber
          fi

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: v${{ inputs.version }}

      - name: Verify and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          WORKDIR=$(mktemp -d)
          gh release download "$TAG" --dir "$WORKDIR" --pattern "Poratake-$VERSION-win-*.exe"
          node scripts/merge-windows-latest-yml.mjs \
            "$VERSION" \
            "$WORKDIR/Poratake-$VERSION-win-x64.exe" \
            "$WORKDIR/Poratake-$VERSION-win-arm64.exe" \
            "$WORKDIR/latest.yml"
          gh release upload "$TAG" "$WORKDIR/latest.yml" --clobber
          EXPECTED_ASSETS=$(node scripts/published-release-assets.mjs expected "$VERSION")
          ACTUAL_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          test "$ACTUAL_ASSETS" = "$EXPECTED_ASSETS"
          gh release edit "$TAG" --draft=false
