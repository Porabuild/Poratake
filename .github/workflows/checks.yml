name: Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: bun run check:daemon-contract && bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Lint
        run: bun run lint

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Format check
        run: bun run format:check

  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: React Compiler
        run: bun run test:react-compiler

      - name: Tests
        run: bun run test:run

      - name: Build macOS daemon
        run: ./scripts/build-daemon.sh

      - name: Check GPUI shell
        run: cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check GPUI shell architectures
        run: |
          cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml --target aarch64-apple-darwin
          cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml --target x86_64-apple-darwin

      - name: Clippy GPUI shell
        run: cargo clippy --locked --manifest-path src/main/app-gpui/Cargo.toml --all-targets -- -D warnings

      - name: Test GPUI shell
        run: cargo test --locked --manifest-path src/main/app-gpui/Cargo.toml

  linux-gpui:
    name: Linux GPUI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libpipewire-0.3-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev xvfb

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-gpui-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Check GPUI shell
        run: cargo check --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui

      - name: Clippy Linux daemon
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --all-targets -- -D warnings

      - name: Clippy GPUI shell
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-gpui --all-targets -- -D warnings

      - name: Test GPUI shell and Linux daemon
        run: cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui

      - name: Test Linux X11 window capture
        run: xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --test x11 -- --ignored

      - name: Test Linux X11 capture with scaled GTK
        run: xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --test x11 -- --ignored
        env:
          GDK_SCALE: 2

  windows-native:
    name: Windows native
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Format, Clippy, and test Windows native
        run: bun run test:daemon-win

      - name: Tests
        run: bun run test:run

  windows-package:
    name: Windows package
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            nasm
            pkgconf
            curl
            tar

      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            src/main/binaries/ffmpeg
            src/main/binaries/whisper
            src/main/daemon/poratake-daemon.exe
          key: ${{ runner.os }}-native-${{ hashFiles('scripts/build-ffmpeg-win.sh', 'scripts/build-whisper-win.ps1', 'src/main/daemon-win/Cargo.toml', 'src/main/Cargo.lock', 'src/main/daemon-win/src/**.rs') }}

      - name: Build Windows package
        run: bun run build-win
        env:
          PORATAKE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          PORATAKE_WIN_ARCH: x64
