name: Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Tests
        run: bun run test:run

      - name: Build macOS daemon
        run: ./scripts/build-daemon.sh

  windows-native:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/daemon-win/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src/main/daemon-win/Cargo.lock') }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src/main/daemon-win/Cargo.toml -- --check

      - name: Test Windows daemon
        run: cargo test --manifest-path src/main/daemon-win/Cargo.toml

      - name: Tests
        run: bun run test:run

  windows-package:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/daemon-win/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src/main/daemon-win/Cargo.lock') }}

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            nasm
            pkgconf
            curl
            tar

      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            src/main/binaries/ffmpeg
            src/main/binaries/whisper
            src/main/daemon/capty-daemon.exe
          key: ${{ runner.os }}-native-${{ hashFiles('scripts/build-ffmpeg-win.sh', 'scripts/build-whisper-win.ps1', 'src/main/daemon-win/Cargo.toml', 'src/main/daemon-win/Cargo.lock', 'src/main/daemon-win/src/**.rs') }}

      - name: Build Windows package
        run: bun run build-win
        env:
          PORATAKE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          PORATAKE_WIN_ARCH: x64
