name: Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Tests
        run: bun run test:run

      - name: Build macOS daemon
        run: ./scripts/build-daemon.sh

  windows-native:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test:run

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src/main/daemon-win/Cargo.toml -- --check

      - name: Test Windows daemon
        run: cargo test --manifest-path src/main/daemon-win/Cargo.toml

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            nasm
            pkgconf
            curl
            tar

      - name: Build Windows package
        run: bun run build-win
        env:
          CAPTY_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
