name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_visual_regressions:
        description: Run the full Windows visual baseline matrix
        required: false
        default: false
        type: boolean
      update_windows_visual_baselines:
        description: Record the Windows visual baselines from this runner
        required: false
        default: false
        type: boolean

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: bun run check:daemon-contract && bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Lint
        run: bun run lint

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Format check
        run: bun run format:check

  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: React Compiler
        run: bun run test:react-compiler

      - name: Tests
        run: bun run test:run

      - name: Build macOS daemon
        run: ./scripts/build-daemon.sh

      - name: Test macOS window ID validation
        run: |
          find src/main/daemon -name '*.swift' -type f ! -name main.swift -print0 |
            xargs -0 swiftc -target "$(uname -m)-apple-macosx13.0" -D WINDOW_ID_VALIDATION_TEST -suppress-warnings \
              tests/native/window-id-validation.swift -o "$RUNNER_TEMP/window-id-validation-test"
          "$RUNNER_TEMP/window-id-validation-test"

      - name: Compile macOS scroll preview fixture
        timeout-minutes: 5
        run: |
          swiftc -O -target "$(uname -m)-apple-macosx13.0" -D SCROLL_CAPTURE_TEST \
            -framework ScreenCaptureKit -o "$RUNNER_TEMP/scroll-capture-preview-test" \
            src/main/daemon/Core/Protocol.swift \
            src/main/daemon/Core/ModuleProtocol.swift \
            src/main/daemon/Core/DaemonContract.generated.swift \
            src/main/daemon/Core/ScreenshotCaptureGeometry.swift \
            src/main/daemon/Core/ExcludedWindowCapture.swift \
            src/main/daemon/ScreenRecorder/Types/RecorderTypes.swift \
            src/main/daemon/UI/ProtectedTooltip.swift \
            src/main/daemon/Modules/ScrollCaptureModule.swift \
            tests/native/scroll-capture-preview.swift

      - name: Run macOS scroll preview fixture
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/scroll-capture-preview-test"

      - name: Test macOS recording target closure
        run: |
          swiftc -target "$(uname -m)-apple-macosx13.0" \
            src/main/daemon/ScreenRecorder/Types/RecorderError.swift \
            src/main/daemon/ScreenRecorder/Recorders/ScreenCaptureFrame.swift \
            tests/native/recording-target-closed.swift \
            -o "$RUNNER_TEMP/recording-target-closed-test"
          "$RUNNER_TEMP/recording-target-closed-test"

      - name: Test macOS recording outline lifecycle
        timeout-minutes: 5
        run: |
          swiftc -target "$(uname -m)-apple-macosx13.0" -D RECORDING_OUTLINE_TEST \
            -framework ScreenCaptureKit -o "$RUNNER_TEMP/recording-outline-lifecycle-test" \
            src/main/daemon/Core/Protocol.swift \
            src/main/daemon/Core/ModuleProtocol.swift \
            src/main/daemon/Core/DaemonContract.generated.swift \
            src/main/daemon/Core/DisplayCoordinates.swift \
            src/main/daemon/Core/FrozenFrameStore.swift \
            src/main/daemon/Core/CameraDeviceLookup.swift \
            src/main/daemon/ScreenRecorder/Types/RecorderTypes.swift \
            src/main/daemon/UI/Theme.swift \
            src/main/daemon/Modules/RecordingOverlayModule.swift \
            src/main/daemon/Modules/CameraPreviewModule.swift \
            src/main/daemon/Modules/FreezeScreenModule.swift \
            tests/native/recording-outline-lifecycle.swift
          "$RUNNER_TEMP/recording-outline-lifecycle-test"

      - name: Test macOS timer control lifecycle
        timeout-minutes: 5
        run: |
          swiftc -target "$(uname -m)-apple-macosx13.0" -D TIMER_CONTROL_TEST \
            src/main/daemon/UI/Theme.swift \
            src/main/daemon/UI/FloatingPanel.swift \
            src/main/daemon/UI/TimerButton.swift \
            src/main/daemon/Core/DisplayCoordinates.swift \
            src/main/daemon/Modules/TimerControlModule.swift \
            tests/native/timer-control-lifecycle.swift \
            -o "$RUNNER_TEMP/timer-control-lifecycle-test"
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --queued
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --late
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --accessibility
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --visible-accessibility
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --restart-press

      - name: Test macOS recording timeline
        run: |
          find src/main/daemon -name '*.swift' -type f ! -name main.swift -print0 |
            xargs -0 swiftc -target "$(uname -m)-apple-macosx13.0" -D RECORDING_TIMELINE_TEST -suppress-warnings \
              tests/native/recording-timeline.swift -o "$RUNNER_TEMP/recording-timeline-test"
          "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-paused.m4a" PORATAKE_TEST_MIC_PAUSED_TOGGLE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-first-pending.m4a" PORATAKE_TEST_MIC_FIRST_PENDING=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-delayed.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_INSTALL_STATIC=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-shifted.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_SHIFTED_CLOCK=1 PORATAKE_TEST_MIC_INSTALL_STATIC=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-late-callback.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_SHIFTED_CLOCK=1 PORATAKE_TEST_MIC_CALLBACK_LATE=1 PORATAKE_TEST_MIC_INSTALL_STATIC=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/microphone-initial-delay.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_INITIAL_DELAY=1 PORATAKE_TEST_MIC_INSTALL_BEFORE_SCREEN=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/microphone-before-screen.m4a" PORATAKE_TEST_MIC_INSTALL_BEFORE_SCREEN=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen.mov" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-pause.mov" PORATAKE_TEST_STATIC_PAUSE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-paused-stop.mov" PORATAKE_TEST_STATIC_PAUSED_STOP=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-no-clock.mov" PORATAKE_TEST_STATIC_NO_CLOCK=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-busy-change.mov" PORATAKE_TEST_VIDEO_DROPPED_CHANGE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-busy-recovered.mov" PORATAKE_TEST_VIDEO_RECOVERED_CHANGE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-busy-first-paused.mov" PORATAKE_TEST_VIDEO_DROPPED_FIRST=1 PORATAKE_TEST_STATIC_PAUSED_STOP=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_VIDEO_FINALIZER_CANCELLED="$RUNNER_TEMP/cancelled-video.mov" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_VIDEO_FINALIZER_BACKPRESSURE="$RUNNER_TEMP/video-backpressure.mov" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_BACKPRESSURE="$RUNNER_TEMP/system-audio-backpressure.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_GAP="$RUNNER_TEMP/system-audio-gap.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_OVERLAP="$RUNNER_TEMP/system-audio-overlap.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_FRACTIONAL_GAPS="$RUNNER_TEMP/system-audio-fractional-gaps.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_INITIAL_OVERLAP="$RUNNER_TEMP/system-audio-initial-overlap.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"

      - name: Test macOS screenshot capture geometry
        run: |
          swiftc -target "$(uname -m)-apple-macosx13.0" \
            src/main/daemon/Core/ScreenshotCaptureGeometry.swift \
            src/main/daemon/Core/FrozenFrameStore.swift \
            tests/native/screenshot-capture-geometry.swift \
            -o "$RUNNER_TEMP/screenshot-capture-geometry-test"
          "$RUNNER_TEMP/screenshot-capture-geometry-test"

      - name: Test macOS display coordinate conversions
        run: |
          swiftc -target "$(uname -m)-apple-macosx13.0" \
            src/main/daemon/Core/DisplayCoordinates.swift \
            tests/native/display-coordinates.swift \
            -o "$RUNNER_TEMP/display-coordinates-test"
          "$RUNNER_TEMP/display-coordinates-test"

      - name: Check GPUI shell
        run: cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check GPUI shell architectures
        run: |
          cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml --target aarch64-apple-darwin
          cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml --target x86_64-apple-darwin

      - name: Clippy GPUI shell
        run: cargo clippy --no-deps --locked --manifest-path src/main/app-gpui/Cargo.toml --all-targets -- -D warnings

      - name: Install FFmpeg for GPUI tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          echo "PORATAKE_FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Test GPUI shell
        run: cargo test --locked --manifest-path src/main/app-gpui/Cargo.toml

  linux-gpui:
    name: Linux GPUI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        uses: ./.github/actions/linux-capture-deps

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-gpui-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Check GPUI shell
        run: cargo check --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui

      - name: Clippy Linux daemon
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --all-targets -- -D warnings

      - name: Clippy GPUI shell
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-gpui --all-targets -- -D warnings

      - name: Test GPUI shell and Linux daemon
        run: cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui

      - name: Test Linux X11 window capture
        run: |
          xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --bin poratake-daemon-linux capture::tests::failed_freeze_presentation_closes_created_windows -- --ignored --exact
          xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --bin poratake-daemon-linux capture::tests::window_source_tracks_moves_resizes_and_closure_at_a_fixed_frame_size -- --ignored --exact
          xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --bin poratake-daemon-linux recording_input::tests::records_global_raw_input_when_a_child_selects_xi2_events -- --ignored --exact
          xvfb-run -a -s "-extension Composite" cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --bin poratake-daemon-linux capture::tests::x11_connection_keeps_working_when_composite_is_unavailable -- --ignored --exact
          xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --test x11 daemon_records_x11_window_frames_and_cursor_across_lifecycle -- --ignored --exact
          xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --test x11 daemon_reports_stop_failed_when_encoder_pipe_write_is_blocked -- --ignored --exact
          xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --test x11 -- --ignored --skip daemon_records_x11_window_frames_and_cursor_across_lifecycle --skip daemon_reports_stop_failed_when_encoder_pipe_write_is_blocked --skip blocked_encoder_proxy_reads_one_frame_then_stalls

      - name: Test Linux X11 capture with scaled GTK
        run: xvfb-run -a cargo test --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-linux --test x11 -- --ignored --skip daemon_records_x11_window_frames_and_cursor_across_lifecycle --skip daemon_reports_stop_failed_when_encoder_pipe_write_is_blocked --skip blocked_encoder_proxy_reads_one_frame_then_stalls
        env:
          GDK_SCALE: 2

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        uses: ./.github/actions/linux-capture-deps

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-${{ runner.arch }}-gpui-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Check GPUI and Linux daemon on arm64
        run: cargo check --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui

      - name: Clippy GPUI and Linux daemon on arm64
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui --all-targets -- -D warnings

  windows-arm64:
    name: Windows arm64
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-${{ runner.arch }}-gpui-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Check GPUI and Windows daemon on arm64
        run: cargo check --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon --package poratake-gpui --target aarch64-pc-windows-msvc

      - name: Clippy GPUI and Windows daemon on arm64
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon --package poratake-gpui --target aarch64-pc-windows-msvc --all-targets -- -D warnings

  windows-native:
    name: Windows native
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # No packaging here, so skip the ~120MB Electron binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: src/main/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src/main/Cargo.lock') }}

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Format, Clippy, and test Windows native
        run: bun run test:daemon-win

      - name: Test native Windows scroll capture stitching
        env:
          PORATAKE_RUN_WINDOWS_SCROLL_CAPTURE_TEST: '1'
        run: pwsh -NoProfile -File scripts/parity/windows-scroll-capture-test.ps1

      - name: Test GPUI accessibility actions
        run: bun scripts/parity/gpui-accessibility-test.mjs

      - name: Inspect Windows audio output availability
        run: |
          $endpointErrors = @()
          $renderEndpoints = @(Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction SilentlyContinue -ErrorVariable +endpointErrors | Where-Object { $_.Status -eq 'OK' -and $_.InstanceId -match '\{0\.0\.0\.' })
          $unexpectedErrors = @($endpointErrors | Where-Object { $_.CategoryInfo.Category -ne [System.Management.Automation.ErrorCategory]::ObjectNotFound })
          if ($unexpectedErrors.Count) { throw $unexpectedErrors[0] }
          Write-Host "Present, healthy audio render endpoints: $($renderEndpoints.Count). Default endpoint and capture remain unverified."

      - name: Test native GPUI recording tooltips
        run: pwsh -NoProfile -File scripts/parity/windows-recording-tooltip-test.ps1

      - name: Test Windows clipboard image formats
        id: clipboard_formats
        run: cargo test --locked --manifest-path src/main/Cargo.toml --package gpui-pre-windows --lib clipboard::tests

      - name: Visual regressions
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_windows_visual_regressions && !inputs.update_windows_visual_baselines }}
        run: bun run test:visual

      - name: Record visual baselines
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_windows_visual_regressions && inputs.update_windows_visual_baselines }}
        run: bun scripts/parity/visual.mjs --update-baselines

      - name: Preserve updated visual baselines
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_windows_visual_baselines }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-visual-baselines
          path: scripts/parity/baselines/win32/**
          if-no-files-found: ignore

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-visual-evidence
          path: |
            ${{ runner.temp }}/poratake-visual-*/**/*.png
            ${{ runner.temp }}/poratake-visual-*/**/renderer.json
            ${{ runner.temp }}/poratake-visual-*/*.json
            ${{ runner.temp }}/poratake-visual-*/*.log
            ${{ runner.temp }}/poratake-visual-tooltip-*/recording/*.mp4
            ${{ runner.temp }}/poratake-scroll-capture-*/**
          if-no-files-found: ignore

      - name: Test native Windows clipboard roundtrip
        if: ${{ !cancelled() && steps.clipboard_formats.outcome == 'success' }}
        env:
          PORATAKE_ISOLATED_CLIPBOARD_TEST: '1'
        run: cargo test --locked --manifest-path src/main/Cargo.toml --package gpui-pre-windows --lib clipboard::tests::native_clipboard_round_trips_text_png_and_dib -- --ignored

      - name: Tests
        run: bun run test:run
