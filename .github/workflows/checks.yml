name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_visual_regressions:
        description: Run the full Windows visual baseline matrix
        required: false
        default: false
        type: boolean
      update_windows_visual_baselines:
        description: Record the Windows visual baselines from this runner
        required: false
        default: false
        type: boolean

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      macos_swift: ${{ steps.filter.outputs.macos_swift }}
      rust_shared: ${{ steps.filter.outputs.rust_shared }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      windows_e2e: ${{ steps.filter.outputs.windows_e2e }}

    steps:
      - name: Checkout PR merge commit
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: filter
        shell: bash
        run: |
          set_all_true() {
            {
              echo "macos=true"
              echo "macos_swift=true"
              echo "rust_shared=true"
              echo "linux=true"
              echo "windows=true"
              echo "windows_e2e=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            set_all_true
            exit 0
          fi

          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            set_all_true
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"

          has_match() {
            printf '%s\n' "$changed" | grep -Eq "$1"
          }

          macos_swift=false
          rust_shared=false
          linux=false
          windows=false
          windows_e2e=false

          if has_match '^(src/main/daemon/|tests/native/|scripts/build-daemon\.sh$|scripts/generate-daemon-contract\.mjs$|src/types/(daemon-contract|platform-capabilities)\.json$|\.github/workflows/checks\.yml$)'; then
            macos_swift=true
          fi

          if has_match '^(src/main/(Cargo\.(toml|lock)|app-gpui/|daemon-common/)|vendor/|\.cargo/|rust-toolchain\.toml$|clippy\.toml$|deny\.toml$|src/types/(daemon-contract|platform-capabilities)\.json$|scripts/generate-daemon-contract\.mjs$|\.github/(workflows/checks\.yml|actions/rust-cache/))'; then
            rust_shared=true
          fi

          macos=false
          if [ "$macos_swift" = "true" ] || [ "$rust_shared" = "true" ]; then
            macos=true
          fi

          if [ "$rust_shared" = "true" ] || has_match '^(src/main/daemon-linux/|\.github/actions/linux-capture-deps/)'; then
            linux=true
          fi

          if [ "$rust_shared" = "true" ] || has_match '^(src/main/daemon-win/|scripts/check-daemon-win\.mjs$)'; then
            windows=true
          fi

          if [ "$windows" = "true" ] || has_match '^scripts/parity/'; then
            windows_e2e=true
          fi

          {
            echo "macos=$macos"
            echo "macos_swift=$macos_swift"
            echo "rust_shared=$rust_shared"
            echo "linux=$linux"
            echo "windows=$windows"
            echo "windows_e2e=$windows_e2e"
          } >> "$GITHUB_OUTPUT"

          echo "Targets: macos=$macos macos_swift=$macos_swift rust_shared=$rust_shared linux=$linux windows=$windows windows_e2e=$windows_e2e"

  js-checks:
    name: JS Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun installs
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check daemon contract
        run: bun run check:daemon-contract

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Tests
        run: bun run test

  test:
    name: macOS
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        if: ${{ needs.changes.outputs.macos_swift == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Build macOS daemon
        if: ${{ needs.changes.outputs.macos_swift == 'true' }}
        run: ./scripts/build-daemon.sh

      - name: Compile macOS Swift tests
        if: ${{ needs.changes.outputs.macos_swift == 'true' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          pids=()

          (
            find src/main/daemon -name '*.swift' -type f ! -name main.swift -print0 |
              xargs -0 swiftc -target "$arch-apple-macosx13.0" -D WINDOW_ID_VALIDATION_TEST -suppress-warnings \
                tests/native/window-id-validation.swift -o "$RUNNER_TEMP/window-id-validation-test"
          ) &
          pids+=($!)

          swiftc -O -target "$arch-apple-macosx13.0" -D SCROLL_CAPTURE_TEST \
            -framework ScreenCaptureKit -o "$RUNNER_TEMP/scroll-capture-preview-test" \
            src/main/daemon/Core/Protocol.swift \
            src/main/daemon/Core/ModuleProtocol.swift \
            src/main/daemon/Core/DaemonContract.generated.swift \
            src/main/daemon/Core/ScreenshotCaptureGeometry.swift \
            src/main/daemon/Core/ExcludedWindowCapture.swift \
            src/main/daemon/ScreenRecorder/Types/RecorderTypes.swift \
            src/main/daemon/UI/ProtectedTooltip.swift \
            src/main/daemon/Modules/ScrollCaptureModule.swift \
            tests/native/scroll-capture-preview.swift &
          pids+=($!)

          (
            find src/main/daemon -name '*.swift' -type f ! -name main.swift -print0 |
              xargs -0 swiftc -target "$arch-apple-macosx13.0" -D RECORDING_TIMELINE_TEST -suppress-warnings \
                tests/native/recording-timeline.swift -o "$RUNNER_TEMP/recording-timeline-test"
          ) &
          pids+=($!)

          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          pids=()

          swiftc -target "$arch-apple-macosx13.0" \
            src/main/daemon/ScreenRecorder/Types/RecorderError.swift \
            src/main/daemon/ScreenRecorder/Recorders/ScreenCaptureFrame.swift \
            tests/native/recording-target-closed.swift \
            -o "$RUNNER_TEMP/recording-target-closed-test" &
          pids+=($!)

          swiftc -target "$arch-apple-macosx13.0" -D RECORDING_OUTLINE_TEST \
            -framework ScreenCaptureKit -o "$RUNNER_TEMP/recording-outline-lifecycle-test" \
            src/main/daemon/Core/Protocol.swift \
            src/main/daemon/Core/ModuleProtocol.swift \
            src/main/daemon/Core/DaemonContract.generated.swift \
            src/main/daemon/Core/DisplayCoordinates.swift \
            src/main/daemon/Core/FrozenFrameStore.swift \
            src/main/daemon/Core/CameraDeviceLookup.swift \
            src/main/daemon/ScreenRecorder/Types/RecorderTypes.swift \
            src/main/daemon/UI/Theme.swift \
            src/main/daemon/Modules/RecordingOverlayModule.swift \
            src/main/daemon/Modules/CameraPreviewModule.swift \
            src/main/daemon/Modules/FreezeScreenModule.swift \
            tests/native/recording-outline-lifecycle.swift &
          pids+=($!)

          swiftc -target "$arch-apple-macosx13.0" -D TIMER_CONTROL_TEST \
            src/main/daemon/UI/Theme.swift \
            src/main/daemon/UI/FloatingPanel.swift \
            src/main/daemon/UI/TimerButton.swift \
            src/main/daemon/Core/DisplayCoordinates.swift \
            src/main/daemon/Modules/TimerControlModule.swift \
            tests/native/timer-control-lifecycle.swift \
            -o "$RUNNER_TEMP/timer-control-lifecycle-test" &
          pids+=($!)

          swiftc -target "$arch-apple-macosx13.0" \
            src/main/daemon/Core/ScreenshotCaptureGeometry.swift \
            src/main/daemon/Core/FrozenFrameStore.swift \
            tests/native/screenshot-capture-geometry.swift \
            -o "$RUNNER_TEMP/screenshot-capture-geometry-test" &
          pids+=($!)

          swiftc -target "$arch-apple-macosx13.0" \
            src/main/daemon/Core/DisplayCoordinates.swift \
            tests/native/display-coordinates.swift \
            -o "$RUNNER_TEMP/display-coordinates-test" &
          pids+=($!)

          for pid in "${pids[@]}"; do
            wait "$pid"
          done

      - name: Run macOS Swift tests
        if: ${{ needs.changes.outputs.macos_swift == 'true' }}
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/window-id-validation-test"
          "$RUNNER_TEMP/scroll-capture-preview-test"
          "$RUNNER_TEMP/recording-target-closed-test"
          "$RUNNER_TEMP/recording-outline-lifecycle-test"
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --queued
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --late
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --accessibility
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --visible-accessibility
          "$RUNNER_TEMP/timer-control-lifecycle-test" 0 128 100 128 --restart-press
          "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-paused.m4a" PORATAKE_TEST_MIC_PAUSED_TOGGLE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-first-pending.m4a" PORATAKE_TEST_MIC_FIRST_PENDING=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-delayed.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_INSTALL_STATIC=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-shifted.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_SHIFTED_CLOCK=1 PORATAKE_TEST_MIC_INSTALL_STATIC=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/static-microphone-late-callback.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_SHIFTED_CLOCK=1 PORATAKE_TEST_MIC_CALLBACK_LATE=1 PORATAKE_TEST_MIC_INSTALL_STATIC=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/microphone-initial-delay.m4a" PORATAKE_TEST_MIC_DELAYED_CAPTURE=1 PORATAKE_TEST_MIC_INITIAL_DELAY=1 PORATAKE_TEST_MIC_INSTALL_BEFORE_SCREEN=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_MIC_STATIC_CLOCK="$RUNNER_TEMP/microphone-before-screen.m4a" PORATAKE_TEST_MIC_INSTALL_BEFORE_SCREEN=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen.mov" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-pause.mov" PORATAKE_TEST_STATIC_PAUSE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-paused-stop.mov" PORATAKE_TEST_STATIC_PAUSED_STOP=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-no-clock.mov" PORATAKE_TEST_STATIC_NO_CLOCK=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-busy-change.mov" PORATAKE_TEST_VIDEO_DROPPED_CHANGE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-busy-recovered.mov" PORATAKE_TEST_VIDEO_RECOVERED_CHANGE=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_STATIC_VIDEO="$RUNNER_TEMP/static-screen-busy-first-paused.mov" PORATAKE_TEST_VIDEO_DROPPED_FIRST=1 PORATAKE_TEST_STATIC_PAUSED_STOP=1 \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_VIDEO_FINALIZER_CANCELLED="$RUNNER_TEMP/cancelled-video.mov" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_VIDEO_FINALIZER_BACKPRESSURE="$RUNNER_TEMP/video-backpressure.mov" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_BACKPRESSURE="$RUNNER_TEMP/system-audio-backpressure.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_GAP="$RUNNER_TEMP/system-audio-gap.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_OVERLAP="$RUNNER_TEMP/system-audio-overlap.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_FRACTIONAL_GAPS="$RUNNER_TEMP/system-audio-fractional-gaps.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          PORATAKE_TEST_SYSTEM_INITIAL_OVERLAP="$RUNNER_TEMP/system-audio-initial-overlap.m4a" \
            "$RUNNER_TEMP/recording-timeline-test"
          "$RUNNER_TEMP/screenshot-capture-geometry-test"
          "$RUNNER_TEMP/display-coordinates-test"

      - name: Install cargo-nextest
        if: ${{ needs.changes.outputs.rust_shared == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust build
        if: ${{ needs.changes.outputs.rust_shared == 'true' }}
        uses: ./.github/actions/rust-cache
        with:
          shared-key: macos-gpui-checks

      - name: Clippy GPUI shell
        if: ${{ needs.changes.outputs.rust_shared == 'true' }}
        run: cargo clippy --no-deps --locked --manifest-path src/main/app-gpui/Cargo.toml --all-targets -- -D warnings

      - name: Install macOS x86_64 Rust target
        if: ${{ needs.changes.outputs.rust_shared == 'true' && github.event_name != 'pull_request' }}
        run: rustup target add x86_64-apple-darwin

      - name: Check GPUI shell x86_64
        if: ${{ needs.changes.outputs.rust_shared == 'true' && github.event_name != 'pull_request' }}
        run: cargo check --locked --manifest-path src/main/app-gpui/Cargo.toml --target x86_64-apple-darwin

      - name: Install FFmpeg for GPUI tests
        if: ${{ needs.changes.outputs.rust_shared == 'true' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          echo "PORATAKE_FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Test GPUI shell
        if: ${{ needs.changes.outputs.rust_shared == 'true' }}
        run: cargo nextest run --locked --manifest-path src/main/app-gpui/Cargo.toml --no-fail-fast

  linux-gpui:
    name: Linux GPUI
    needs: changes
    if: ${{ needs.changes.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        uses: ./.github/actions/linux-capture-deps

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache
        with:
          shared-key: linux-x64-gpui

      - name: Clippy GPUI shell and Linux daemon
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui --all-targets -- -D warnings

      - name: Test GPUI shell and Linux daemon
        run: cargo nextest run --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui --no-fail-fast

      - name: Test Linux X11 window capture
        run: |
          nextest_args=(--locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui --run-ignored only --test-threads=1)
          xvfb-run -a cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=poratake-daemon-linux) & test(=capture::tests::failed_freeze_presentation_closes_created_windows)'
          xvfb-run -a cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=poratake-daemon-linux) & test(=capture::tests::window_source_tracks_moves_resizes_and_closure_at_a_fixed_frame_size)'
          xvfb-run -a cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=poratake-daemon-linux) & test(=recording_input::tests::records_global_raw_input_when_a_child_selects_xi2_events)'
          xvfb-run -a -s "-extension Composite" cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=poratake-daemon-linux) & test(=capture::tests::x11_connection_keeps_working_when_composite_is_unavailable)'
          xvfb-run -a cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=x11) & test(=daemon_records_x11_window_frames_and_cursor_across_lifecycle)'
          xvfb-run -a cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=x11) & test(=daemon_reports_stop_failed_when_encoder_pipe_write_is_blocked)'
          xvfb-run -a cargo nextest run "${nextest_args[@]}" -E 'package(poratake-daemon-linux) & binary(=x11) & not (test(=daemon_records_x11_window_frames_and_cursor_across_lifecycle) | test(=daemon_reports_stop_failed_when_encoder_pipe_write_is_blocked) | test(=blocked_encoder_proxy_reads_one_frame_then_stalls))'

      - name: Test Linux X11 capture with scaled GTK
        run: xvfb-run -a cargo nextest run --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui --run-ignored only --test-threads=1 -E 'package(poratake-daemon-linux) & binary(=x11) & not (test(=daemon_records_x11_window_frames_and_cursor_across_lifecycle) | test(=daemon_reports_stop_failed_when_encoder_pipe_write_is_blocked) | test(=blocked_encoder_proxy_reads_one_frame_then_stalls))'
        env:
          GDK_SCALE: 2

  linux-arm64:
    name: Linux arm64
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        uses: ./.github/actions/linux-capture-deps

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache
        with:
          shared-key: linux-arm64-gpui

      - name: Clippy GPUI and Linux daemon on arm64
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon-linux --package poratake-gpui --all-targets -- -D warnings

  windows-arm64:
    name: Windows arm64
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache
        with:
          shared-key: windows-arm64-gpui

      - name: Clippy GPUI and Windows daemon on arm64
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --package poratake-daemon-common --package poratake-daemon --package poratake-gpui --target aarch64-pc-windows-msvc --all-targets -- -D warnings

  windows-native:
    name: Windows native
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache
        with:
          shared-key: windows-x64-gpui

      - name: Format check
        run: cargo fmt --manifest-path src/main/Cargo.toml --all -- --check

      - name: Clippy Windows workspace
        run: cargo clippy --locked --manifest-path src/main/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Check licenses and advisories
        run: cargo deny --manifest-path src/main/Cargo.toml check

      - name: Test Windows workspace
        run: cargo nextest run --locked --manifest-path src/main/Cargo.toml --workspace --no-fail-fast

      - name: Test Windows clipboard image formats
        id: clipboard_formats
        run: cargo test --locked --manifest-path src/main/Cargo.toml --package gpui-pre-windows --lib clipboard::tests

      - name: Test native Windows clipboard roundtrip
        if: ${{ !cancelled() && steps.clipboard_formats.outcome == 'success' }}
        env:
          PORATAKE_ISOLATED_CLIPBOARD_TEST: '1'
        run: cargo test --locked --manifest-path src/main/Cargo.toml --package gpui-pre-windows --lib clipboard::tests::native_clipboard_round_trips_text_png_and_dib -- --ignored

  windows-desktop-e2e:
    name: Windows desktop E2E
    needs: changes
    if: ${{ needs.changes.outputs.windows_e2e == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache
        with:
          shared-key: windows-x64-gpui
          save-if: 'false'

      - name: Test native Windows scroll capture stitching
        env:
          PORATAKE_RUN_WINDOWS_SCROLL_CAPTURE_TEST: '1'
        run: pwsh -NoProfile -File scripts/parity/windows-scroll-capture-test.ps1

      - name: Inspect Windows audio output availability
        run: |
          $endpointErrors = @()
          $renderEndpoints = @(Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction SilentlyContinue -ErrorVariable +endpointErrors | Where-Object { $_.Status -eq 'OK' -and $_.InstanceId -match '\{0\.0\.0\.' })
          $unexpectedErrors = @($endpointErrors | Where-Object { $_.CategoryInfo.Category -ne [System.Management.Automation.ErrorCategory]::ObjectNotFound })
          if ($unexpectedErrors.Count) { throw $unexpectedErrors[0] }
          Write-Host "Present, healthy audio render endpoints: $($renderEndpoints.Count). Default endpoint and capture remain unverified."

      - name: Test native GPUI recording tooltips
        run: pwsh -NoProfile -File scripts/parity/windows-recording-tooltip-test.ps1

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-evidence
          path: |
            ${{ runner.temp }}/poratake-visual-*/**/*.png
            ${{ runner.temp }}/poratake-visual-*/**/renderer.json
            ${{ runner.temp }}/poratake-visual-*/*.json
            ${{ runner.temp }}/poratake-visual-*/*.log
            ${{ runner.temp }}/poratake-visual-tooltip-*/recording/*.mp4
            ${{ runner.temp }}/poratake-scroll-capture-*/**
          if-no-files-found: ignore

  windows-visual-regressions:
    name: Windows visual (${{ matrix.shard }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_visual_regressions }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: light-950
            theme: light
            width: '950'
            scales: '1,1.25,1.5,2'
          - shard: dark-950
            theme: dark
            width: '950'
            scales: '1,1.25,1.5,2'
          - shard: light-1280-1
            theme: light
            width: '1280'
            scales: '1'
          - shard: dark-1280-1
            theme: dark
            width: '1280'
            scales: '1'
          - shard: light-1280-hi
            theme: light
            width: '1280'
            scales: '1.25,1.5,2'
          - shard: dark-1280-hi
            theme: dark
            width: '1280'
            scales: '1.25,1.5,2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache
        with:
          shared-key: windows-x64-gpui
          save-if: 'false'

      - name: Visual regressions
        if: ${{ !cancelled() && !inputs.update_windows_visual_baselines }}
        run: bun scripts/parity/visual.mjs --theme=${{ matrix.theme }} --width=${{ matrix.width }} --scale=${{ matrix.scales }}

      - name: Record visual baselines
        if: ${{ !cancelled() && inputs.update_windows_visual_baselines }}
        run: bun scripts/parity/visual.mjs --update-baselines --theme=${{ matrix.theme }} --width=${{ matrix.width }} --scale=${{ matrix.scales }}

      - name: Stage updated visual baselines
        if: ${{ always() && inputs.update_windows_visual_baselines }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'shard-baselines'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          foreach ($s in '${{ matrix.scales }}'.Split(',')) {
            $name = "${{ matrix.theme }}-${{ matrix.width }}-$s"
            $src = Join-Path 'scripts/parity/baselines/win32' $name
            if (Test-Path -LiteralPath $src) {
              Copy-Item -Path $src -Destination (Join-Path $dest $name) -Recurse -Force
            }
          }

      - name: Preserve updated visual baselines
        if: ${{ always() && inputs.update_windows_visual_baselines }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-visual-baselines-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-baselines/**
          if-no-files-found: ignore

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-visual-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/poratake-visual-*/**/*.png
            ${{ runner.temp }}/poratake-visual-*/**/renderer.json
            ${{ runner.temp }}/poratake-visual-*/*.json
            ${{ runner.temp }}/poratake-visual-*/*.log
          if-no-files-found: ignore

  windows-visual-baselines:
    name: Merge Windows visual baselines
    needs: windows-visual-regressions
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_windows_visual_regressions && inputs.update_windows_visual_baselines }}
    runs-on: ubuntu-latest

    steps:
      - name: Download visual baseline shards
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/windows-visual-baselines
          pattern: windows-visual-baselines-*
          merge-multiple: true

      - name: Upload merged visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: windows-visual-baselines
          path: ${{ runner.temp }}/windows-visual-baselines/**
          if-no-files-found: ignore
