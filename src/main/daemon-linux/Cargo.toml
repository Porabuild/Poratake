[package]
name = "poratake-daemon-linux"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version.workspace = true

[features]
default = ["wayland"]
wayland = ["dep:zed-scap"]

[dependencies]
poratake-daemon-common = { path = "../daemon-common", features = [
  "qrcode-decode",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
base64 = "0.23.1"
glib = "0.18.5"
global-hotkey = "0.8.0"
gtk = "0.18.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.189"
xcb = { version = "1.7.1", features = [
  "composite",
  "randr",
  "xinput",
  "xtest",
] }
zed-scap = { version = "0.0.8-zed", optional = true, default-features = false, features = [
  "wayland",
] }

[lints]
workspace = true
