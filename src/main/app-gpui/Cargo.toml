[package]
name = "poratake-gpui"
version = "0.9.5"
edition = "2021"
license = "AGPL-3.0-only"
rust-version.workspace = true
description = "Poratake native shell (GPUI)"

[[bin]]
name = "poratake-gpui"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = [
  "windows-manifest",
] }
raw-window-handle = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
] }
parking_lot = "0.12"
dirs = "6"
lyon = "1"
smallvec = "1"
arboard = "3.6.1"
rfd = "0.15"
chrono = "0.4.45"
smol = "2.0.2"
global-hotkey = "0.8.0"
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemServices",
  "Win32_System_Registry",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "UI_Notifications",
] }
tray-icon = { version = "0.24.2", default-features = false }
md-5 = "0.11.0"
fontdue = "0.9.4"
tiny-skia = "0.11.4"
usvg = "0.45.1"
resvg = "0.45.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11.0"
hmac = "0.13.0"
base64 = "0.23.1"

[dev-dependencies]
# `TestAppContext` and the `gpui::test` macro live behind this feature. It is a
# dev-dependency only, so the shipped binary is unaffected — it exists so the
# windows can be rendered headlessly and a panic on a render path fails CI
# instead of the user.
gpui = { version = "0.2.2", default-features = false, features = [
  "test-support",
] }
tempfile = "3"

[lints]
workspace = true
