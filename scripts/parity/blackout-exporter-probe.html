<!doctype html>
<meta charset="utf-8" />
<pre id="result">pending</pre>
<script type="module">
  import { exportAnnotationToSvg } from '/src/renderer/components/editor/annotations/export-annotation.ts';

  const results = [];
  for (const scale of [1, 1.25, 2]) {
    for (const offset of [0, 0.25, 0.5]) {
      const shape = {
        id: 'shape',
        type: 'rectangle',
        x: 30 + offset,
        y: 20 + offset,
        width: 24,
        height: 24,
        fill: '#ff00ff',
        stroke: '#ff00ff',
        strokeWidth: 1,
      };
      const blackout = {
        id: 'blackout',
        type: 'redact',
        x: 32 + offset,
        y: 22 + offset,
        width: 20,
        height: 20,
        style: 'blackout',
        intensity: 2,
      };
      const width = Math.round(100 * scale);
      const height = Math.round(80 * scale);
      const x = blackout.x * scale;
      const y = blackout.y * scale;
      for (const [order, annotations] of [
        ['shape-blackout', [shape, blackout]],
        ['blackout-shape', [blackout, shape]],
      ]) {
        const layers = annotations
          .map(annotation =>
            exportAnnotationToSvg(annotation, {
              offsetX: 0,
              offsetY: 0,
              scale,
            })
          )
          .join('');
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">${layers}</svg>`;
        const url = URL.createObjectURL(
          new Blob([svg], { type: 'image/svg+xml' })
        );
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        context.fillStyle = 'rgb(64, 128, 192)';
        context.fillRect(0, 0, width, height);
        context.fillStyle = '#000000';
        context.fillRect(
          Math.floor(x),
          Math.floor(y),
          Math.ceil(blackout.width * scale),
          Math.ceil(blackout.height * scale)
        );
        context.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        const pixels = context.getImageData(
          Math.floor(x),
          Math.floor(y),
          4,
          4
        ).data;
        const rgba = Array.from({ length: 4 }, (_, row) =>
          Array.from({ length: 4 }, (_, column) =>
            Array.from(
              pixels.slice((row * 4 + column) * 4, (row * 4 + column + 1) * 4)
            )
          )
        );
        results.push({ scale, offset, order, x, y, rgba });
      }
    }
  }
  const annotation = {
    id: 'standalone',
    type: 'redact',
    x: 8.5,
    y: 3.25,
    width: 12.3,
    height: 12.4,
    style: 'blackout',
    intensity: 5,
  };
  const markup = exportAnnotationToSvg(annotation, {
    offsetX: 0,
    offsetY: 0,
    scale: 1,
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="24">${markup}</svg>`;
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  const image = new Image();
  await new Promise((resolve, reject) => {
    image.onload = resolve;
    image.onerror = reject;
    image.src = url;
  });
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 24;
  const context = canvas.getContext('2d');
  context.fillStyle = '#ffffff';
  context.fillRect(0, 0, 32, 24);
  context.fillStyle = '#000000';
  context.fillRect(
    Math.floor(annotation.x),
    Math.floor(annotation.y),
    Math.ceil(annotation.width),
    Math.ceil(annotation.height)
  );
  context.drawImage(image, 0, 0);
  URL.revokeObjectURL(url);
  const standaloneBoundary = [8, 20, 21].map(x => ({
    x,
    y: 9,
    rgba: Array.from(context.getImageData(x, 9, 1, 1).data),
  }));
  document.querySelector('#result').textContent = JSON.stringify({
    samples: results,
    standaloneBoundary,
  });
</script>
